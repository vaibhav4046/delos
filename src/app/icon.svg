<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- DelOS favicon · bold pixel D · readable at 16x16 tab icon size.
       Yellow tile with dark navy D letterform · matches Logo wordmark. -->
  <!-- Bezel · tile background -->
  <rect x="0" y="0" width="32" height="32" fill="#1b1b2e"/>
  <rect x="2" y="2" width="28" height="28" fill="#fbc531"/>
  <rect x="2" y="2" width="28" height="2" fill="#fff3a6"/>
  <rect x="2" y="2" width="2" height="28" fill="#fff3a6"/>
  <rect x="2" y="28" width="28" height="2" fill="#7a4f0d"/>
  <rect x="28" y="2" width="2" height="28" fill="#7a4f0d"/>
  <!-- Bold D letterform · 4px stroke, simple geometry -->
  <!-- Left vertical bar -->
  <rect x="7" y="7" width="4" height="18" fill="#1b1b2e"/>
  <!-- Top horizontal bar -->
  <rect x="7" y="7" width="14" height="4" fill="#1b1b2e"/>
  <!-- Bottom horizontal bar -->
  <rect x="7" y="21" width="14" height="4" fill="#1b1b2e"/>
  <!-- Right vertical bar -->
  <rect x="21" y="11" width="4" height="10" fill="#1b1b2e"/>
</svg>
