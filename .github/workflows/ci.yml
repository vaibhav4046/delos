name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          # Provide stub env vars so the build doesn't fail on validation.
          # Real keys live in Vercel project settings, not in CI.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'ci-stub' }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || 'ci-stub' }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || 'ci-stub' }}
          HYDRA_DB_API_KEY: ${{ secrets.HYDRA_DB_API_KEY || 'ci-stub' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-stub-secret-min-32-chars-please' }}
          DELRIO_TENANT_ID: ci_tenant

  regression:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    # Only run regression on PRs and pushes to main if a preview URL is supplied
    # via the JUDGE_REGRESSION_URL env. CI does not boot a dev server.
    if: ${{ env.JUDGE_REGRESSION_URL != '' }}
    env:
      JUDGE_REGRESSION_URL: ${{ secrets.JUDGE_REGRESSION_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run judge-regression
        run: node scripts/judge-regression.mjs "$JUDGE_REGRESSION_URL"
